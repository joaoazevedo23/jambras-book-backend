services:
  postgres:
    image: postgres:16-alpine
    container_name: bookr_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bookr
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookr"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: bookr_api
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/bookr?schema=public"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: